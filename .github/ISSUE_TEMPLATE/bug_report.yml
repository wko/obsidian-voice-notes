name: Bug report
description: Report a reproducible problem in Voice Append
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Voice Append version, Obsidian version, operating system, and device
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Additional details
      description: Remove API keys, recordings, transcripts, note contents, and other sensitive data.
